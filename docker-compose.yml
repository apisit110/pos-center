x-database-url: &database-url postgres://postgres:change-me@postgres:5432/lightning_pos

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: lightning_pos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  db-migrate: &db-job
    image: pos-center/portal-service:${RELEASE:?set RELEASE e.g. RELEASE=1.0.0}
    profiles: ['tools']
    command: ['node', 'packages/database/dist/migrate.js']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  db-seed:
    <<: *db-job
    command: ['node', 'packages/database/dist/seed.js']

  portal-service:
    image: pos-center/portal-service:${RELEASE:?set RELEASE e.g. RELEASE=1.0.0}
    restart: unless-stopped
    environment:
      PORT: 4001
      DATABASE_URL: *database-url
      JWT_SECRET: change-me
      PORTAL_ORIGIN: http://localhost:4000
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  pos-sync-service:
    image: pos-center/pos-sync-service:${RELEASE:?set RELEASE e.g. RELEASE=1.0.0}
    restart: unless-stopped
    environment:
      PORT: 4002
      DATABASE_URL: *database-url
      SYNC_JWT_SECRET: change-me
    ports:
      - '4002:4002'
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  portal:
    image: pos-center/portal:${RELEASE:?set RELEASE e.g. RELEASE=1.0.0}
    restart: unless-stopped
    ports:
      - '4000:4000'
    depends_on:
      portal-service:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
