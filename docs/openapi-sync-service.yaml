openapi: 3.0.3
info:
  title: Lightning POS - POS Sync Service API
  version: 1.0.0
  description: |
    API of `pos-sync-service` used by the POS client (cashier) to sync data with the POS center.

    Source of truth: flow docs in `docs/sync/flow/*`.

    **Authentication** (see `docs/sync/flow/authentication.md`)

    ```
    1) POST /api/v1/sync/auth/token   x-partner-id / x-client-id / x-client-secret + { tid }
       -> { access_token, token_type: "Bearer", expires_in: 3600 }
    2) every other sync api           Authorization: Bearer <access_token>
    3) 401 "Token expired"            -> request a new token (step 1) and retry
    ```

    The token belongs to one terminal (claims `sub` = tid, `mid` = partner_id, `sid` = store sid).
    Every merchant / store / terminal in a request body must match the token, otherwise `403 Request does not match the token`
    and nothing is synced. Call the service over HTTPS only.

    **Response format**

    Success and error bodies are plain JSON (no `res_code` envelope). Errors are `{ "message", "request_id" }`,
    validation errors also have `errors`.

servers:
  - url: http://localhost:4002
    description: Local

security:
  - syncBearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Pull
    description: POS center -> POS client
  - name: Push
    description: POS client -> POS center

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: pos-sync-service

  # ---------------------------------------------------------------- Auth
  /api/v1/sync/auth/token:
    post:
      tags: [Auth]
      summary: Issue sync access token
      description: |
        Authenticates the merchant credential (provider `POS_CASHIER`, created in portal) and the terminal `tid`,
        then signs a JWT (HS256, `iss` = `pos-sync-service`, `aud` = `pos-cashier`, expires in 3600 seconds).

        `401 Invalid credential` is the same for wrong partner id, client id or client secret.
      security: []
      parameters:
        - name: x-partner-id
          in: header
          required: true
          description: Merchant `partner_id`
          schema:
            type: string
            minLength: 1
        - name: x-client-id
          in: header
          required: true
          description: Merchant credential `client_id`
          schema:
            type: string
            minLength: 1
        - name: x-client-secret
          in: header
          required: true
          description: Merchant credential `client_secret` (plain)
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tid]
              properties:
                tid:
                  type: string
                  minLength: 1
                  description: Terminal `tid` of the POS client
                  example: '0001000101'
      responses:
        '200':
          description: Token issued
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 3600
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Invalid credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Invalid credential
                request_id: da8e72fa-34c7-419e-932a-c3436fdad704
        '404':
          $ref: '#/components/responses/TerminalNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Pull
  /api/v1/sync/pull/state:
    post:
      tags: [Pull]
      summary: Pull sync state (versions)
      description: |
        Cheap check before pull products / pull cashier-profile, call it on login and after a sale.
        The client pulls products when `productVersion` > its last `syncVersion`, and the cashier profile
        when `profileVersion` != its last `profile_version`. The same versions are returned as `syncState`
        in the push responses. No request body.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current versions
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Sync completed successfully
                  - $ref: '#/components/schemas/SyncState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sync/pull/cashier-profile:
    post:
      tags: [Pull]
      summary: Pull cashier profile
      description: |
        Used when the cashier is set up in online mode. Returns the merchant, store and terminal of the token,
        and all staff of the merchant (every status, the client uses `status` to allow or block login, and
        `pin_hash` to verify the PIN offline). No request body.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Cashier profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sync completed successfully
                  profile_version:
                    type: string
                    description: Version of this profile, compare with `profileVersion` of pull state
                    example: 8b06e33cda24719c5e0a5d417505821b
                  merchant:
                    type: object
                    properties:
                      uid:
                        type: string
                      partner_id:
                        type: string
                        example: '0001'
                      name_en:
                        type: string
                      name_th:
                        type: string
                  store:
                    type: object
                    properties:
                      uid:
                        type: string
                      sid:
                        type: string
                        example: '00010001'
                      name_en:
                        type: string
                      name_th:
                        type: string
                  terminal:
                    type: object
                    properties:
                      uid:
                        type: string
                      tid:
                        type: string
                        example: '0001000101'
                      name_en:
                        type: string
                      name_th:
                        type: string
                  staffs:
                    type: array
                    items:
                      type: object
                      properties:
                        uid:
                          type: string
                        username:
                          type: string
                          example: '00010001'
                        full_name:
                          type: string
                          description: Empty string if not set
                        status:
                          type: string
                          enum: [PENDING, ACTIVE, SUSPENDED, INACTIVE]
                        roles:
                          type: array
                          description: '`cashier_role.name`, empty array if none'
                          items:
                            type: string
                          example: [MANAGER]
                        pin_hash:
                          type: string
                          description: '`pin.pin_hash` of app `APP0001`, empty string if no pin'
                        updated_at:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TerminalNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sync/pull/products:
    post:
      tags: [Pull]
      summary: Pull products of the store (incremental)
      description: |
        Returns products of the store with `map_store_product.sync_version` > `syncVersion`.
        The client keeps the max `syncVersion` of the result for the next pull.
        Empty list if the merchant or store is not found.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [syncVersion]
              properties:
                mid:
                  type: string
                  minLength: 1
                  deprecated: true
                  description: Deprecated, taken from the token. Merchant `partner_id`; when sent it must match the token
                sid:
                  type: string
                  minLength: 1
                  deprecated: true
                  description: Deprecated, taken from the token. Store `sid`; when sent it must match the token
                syncVersion:
                  type: integer
                  minimum: 0
                  description: Last sync version known by the client (0 = pull all)
                  example: 0
      responses:
        '200':
          description: Changed products
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sync completed successfully
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncProduct'
                  count:
                    type: integer
                    example: 1
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeMismatch'
        '500':
          description: '`Sync failed` (query products failed, no `request_id`) or `Internal server error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                syncFailed:
                  value:
                    message: Sync failed
                internal:
                  value:
                    message: Internal server error
                    request_id: da8e72fa-34c7-419e-932a-c3436fdad704

  # ---------------------------------------------------------------- Push
  /api/v1/sync/push/products:
    post:
      tags: [Push]
      summary: Push products (create / edit)
      description: |
        Upsert products by `uid` and add them to the store. Each product is processed one by one, an error does not stop the others.
        All products of one request get one new `product_version`, so other POS clients of the store pull the change.

        - `barcode` is also saved as `sku`, `name` as both `name_en` and `name_th`, `basePrice` also as the store price
        - `brand` is matched by `name_en` or `name_th`; not found -> no brand
        - merchant / store not found -> every product gets `error` (`Merchant <partnerId> not found` / `Store <sid> not found`)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [products]
              properties:
                mid:
                  type: string
                  minLength: 1
                  deprecated: true
                  description: Deprecated, taken from the token. Merchant `partner_id`; when sent it must match the token
                sid:
                  type: string
                  minLength: 1
                  deprecated: true
                  description: Deprecated, taken from the token. Store `sid`; when sent it must match the token
                products:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, barcode, name, basePrice]
                    properties:
                      id:
                        type: string
                        minLength: 1
                        description: Product `uid` (generated by POS client)
                        example: PRD-0001
                      barcode:
                        type: string
                        minLength: 1
                        example: '8850000000001'
                      name:
                        type: string
                        minLength: 1
                        example: Water 600ml
                      basePrice:
                        type: number
                        minimum: 0
                        example: 10
                      imageUrl:
                        type: string
                        nullable: true
                      unitName:
                        type: string
                        nullable: true
                        example: bottle
                      brand:
                        type: string
                        nullable: true
                        description: Brand name (EN or TH)
      responses:
        '200':
          description: Products processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Products received successfully
                  results:
                    type: array
                    description: Same order as request
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum: [synced, already_synced, error]
                          description: '`synced` = new in the store, `already_synced` = already in the store (updated)'
                        error:
                          type: string
                          description: Only when `status` is `error`
                  syncState:
                    $ref: '#/components/schemas/SyncState'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeMismatch'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sync/push/orders:
    post:
      tags: [Push]
      summary: Push orders
      description: |
        Each order is processed one by one, an error does not stop the others.
        Idempotent by `order_id` + `store_id`: already synced orders return `already_synced`.
        Push the order before its transaction.

        An order gets `error` when the merchant, store, terminal (`terminal_id` missing or not found), staff or any item product is not found.
        A `member_id` that is not found is saved as null. Status `CANCELLED` is saved as `VOID`.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orders]
              properties:
                orders:
                  type: array
                  items:
                    type: object
                    required: [order_id, merchant_id, store_id, staff_id, total_amount, status, items, created_at]
                    properties:
                      order_id:
                        type: string
                        minLength: 1
                        description: Local order id from POS client
                        example: ORD-0001
                      merchant_id:
                        type: string
                        minLength: 1
                        description: Merchant `partner_id` (must match the token)
                      store_id:
                        type: string
                        minLength: 1
                        description: Store `sid` (must match the token)
                      terminal_id:
                        type: string
                        nullable: true
                        default: null
                        description: Terminal `tid` (must match the token when not null). The order fails without it
                      staff_id:
                        type: string
                        minLength: 1
                        description: Cashier staff `username`
                      member_id:
                        type: string
                        nullable: true
                        default: null
                        description: Member `phone_no`
                      total_amount:
                        type: number
                        example: 125.5
                      status:
                        type: string
                        enum: [PENDING, PAID, CANCELLED, VOID, REFUNDED]
                      items:
                        type: array
                        items:
                          type: object
                          required: [product_id, quantity, price]
                          properties:
                            product_id:
                              type: string
                              minLength: 1
                              description: Product `uid`
                            quantity:
                              type: integer
                              example: 1
                            price:
                              type: number
                              description: Price per unit
                              example: 125.5
                      created_at:
                        type: string
                        format: date-time
      responses:
        '200':
          description: Orders processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Order sync process completed
                  results:
                    type: array
                    description: Same order as request
                    items:
                      type: object
                      properties:
                        orderId:
                          type: string
                          example: ORD-0001
                        globalOrderId:
                          type: string
                          description: Order id in POS center, empty string when `status` is `error`
                          example: '1'
                        status:
                          $ref: '#/components/schemas/SyncResultStatus'
                  syncState:
                    $ref: '#/components/schemas/SyncState'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeMismatch'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/sync/push/transactions:
    post:
      tags: [Push]
      summary: Push transactions (payments)
      description: |
        Each transaction is processed one by one, an error does not stop the others.
        Idempotent by transaction uid (currently = `order_id`): already synced transactions return `already_synced`.
        The referenced order must be pushed first.

        Mapping: `QR_PROMPTPAY` -> `QR`, `SUCCESS` -> `APPROVED`. `CREDIT_CARD` is not supported yet (result `error`).
        A transaction gets `error` when the merchant, store or order is not found. A `terminal_id` that is not found is saved as null.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactions]
              properties:
                transactions:
                  type: array
                  items:
                    type: object
                    required: [id, order_id, merchant_id, store_id, amount, payment_method, status, staff_name, created_at]
                    properties:
                      id:
                        type: string
                        minLength: 1
                        description: Transaction id from POS client
                      order_id:
                        type: string
                        minLength: 1
                        description: Local order id from POS client
                        example: ORD-0001
                      merchant_id:
                        type: string
                        minLength: 1
                        description: Merchant `partner_id` (must match the token)
                      store_id:
                        type: string
                        minLength: 1
                        description: Store `sid` (must match the token)
                      terminal_id:
                        type: string
                        nullable: true
                        default: null
                        description: Terminal `tid` (must match the token when not null)
                      amount:
                        type: number
                        example: 125.5
                      payment_method:
                        type: string
                        enum: [CASH, CREDIT_CARD, QR_PROMPTPAY]
                      status:
                        type: string
                        enum: [SUCCESS, FAILED, REFUNDED]
                      staff_name:
                        type: string
                        minLength: 1
                      created_at:
                        type: string
                        format: date-time
      responses:
        '200':
          description: Transactions processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Transaction sync process completed
                  results:
                    type: array
                    description: Same order as request
                    items:
                      type: object
                      properties:
                        transactionId:
                          type: string
                          description: Transaction uid (currently = `order_id` from request)
                          example: ORD-0001
                        globalTransactionId:
                          type: string
                          description: Transaction id in POS center, empty string when `status` is `error`
                        status:
                          $ref: '#/components/schemas/SyncResultStatus'
                  syncState:
                    $ref: '#/components/schemas/SyncState'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ScopeMismatch'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    syncBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /api/v1/sync/auth/token`

  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: Correlation id for log, a uuid is generated if not provided
      schema:
        type: string

  responses:
    ValidationFailed:
      description: Request headers or body is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    Unauthorized:
      description: |
        `Invalid token` (missing, wrong signature / issuer / audience / algorithm, or invalid claims)
        or `Token expired` (request a new token and retry)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidToken:
              value:
                message: Invalid token
                request_id: da8e72fa-34c7-419e-932a-c3436fdad704
            tokenExpired:
              value:
                message: Token expired
                request_id: da8e72fa-34c7-419e-932a-c3436fdad704
    ScopeMismatch:
      description: A merchant / store / terminal in the body is not the one of the token. Nothing is synced
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Request does not match the token
            request_id: da8e72fa-34c7-419e-932a-c3436fdad704
    TerminalNotFound:
      description: Terminal not found, not mapped to a store, or not of the merchant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Terminal not found
            request_id: da8e72fa-34c7-419e-932a-c3436fdad704
    InternalServerError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Internal server error
            request_id: da8e72fa-34c7-419e-932a-c3436fdad704

  schemas:
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        request_id:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
                example: [orders, 0, store_id]
              message:
                type: string
        request_id:
          type: string

    SyncState:
      type: object
      description: Current versions, see pull state. Left out of a push response when the lookup failed (the push is still saved)
      properties:
        productVersion:
          type: integer
          description: Max `map_store_product.sync_version` of the store, 0 if the store has no products
          example: 40
        profileVersion:
          type: string
          description: Version (md5 fingerprint) of the cashier profile
          example: 8b06e33cda24719c5e0a5d417505821b

    SyncResultStatus:
      type: string
      enum: [synced, already_synced, error]

    SyncProduct:
      type: object
      properties:
        id:
          type: string
          description: Product `uid`
        merchantId:
          type: string
          description: Merchant `partner_id`
        storeId:
          type: string
          description: Store `sid`
        name:
          type: string
          description: Same as `nameTh`
        nameEn:
          type: string
        nameTh:
          type: string
        sku:
          type: string
          description: Empty string if not set
        barcode:
          type: string
          description: Empty string if not set
        basePrice:
          type: number
          example: 125.5
        imageUrl:
          type: string
          description: Empty string if not set
        brand:
          type: string
          description: Brand `name_en`, empty string if not set
        syncVersion:
          type: integer
          description: '`map_store_product.sync_version`'
